<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment Preview - Virtual Labs</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #bae6fd 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --border: rgba(186, 230, 253, 0.8);
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #0284c7;
      --primary-hover: #0369a1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }

    .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; box-shadow: 0 15px 35px rgba(0,0,0,0.06); backdrop-filter: blur(10px); }
    
    .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--primary); font-weight: 600; margin-bottom: 1.5rem; transition: transform 0.2s; }
    .back-btn:hover { transform: translateX(-3px); }

    h1 { font-size: 2rem; margin-bottom: 0.75rem; color: var(--text-main); }
    .tag { display: inline-block; background: #e0f2fe; color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 1rem; }
    .description { color: var(--text-muted); line-height: 1.6; font-size: 1.05rem; margin-bottom: 2rem; }

    .preview-graphic { width: 100%; height: 320px; background: #0f172a; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #38bdf8; position: relative; overflow: hidden; margin-bottom: 2rem; border: 1px solid var(--border); }
    .preview-graphic h3 { font-size: 1.5rem; margin-bottom: 0.5rem; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
    .preview-graphic p { color: #94a3b8; font-size: 0.95rem; }

    .section-title { font-size: 1.2rem; color: var(--primary); margin: 1.5rem 0 0.75rem 0; border-left: 4px solid var(--primary); padding-left: 0.6rem; }
    .list { list-style-position: inside; color: var(--text-muted); line-height: 1.7; margin-bottom: 1.5rem; }

    .launch-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .btn-launch { background: var(--primary); color: white; padding: 0.9rem 2rem; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 1rem; transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); }
    .btn-launch:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4); }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to All Experiments</a>
    
    <span class="tag" id="expCategory">Category</span>
    <h1 id="expTitle">Experiment Title</h1>
    <p class="description" id="expDesc">Description loading...</p>

    <div class="preview-graphic">
      <h3 id="graphicTitle">Interactive Simulation Preview</h3>
      <p id="graphicSub">3D Apparatus Setup & Controls</p>
    </div>

    <h3 class="section-title">Key Objectives</h3>
    <ul class="list" id="expObjectives"></ul>

    <h3 class="section-title">Formulae & Concepts</h3>
    <ul class="list" id="expFormulas"></ul>

    <div class="launch-bar">
      <span>Ready to perform the experiment?</span>
      <a href="#" id="launchBtn" class="btn-launch">Launch Interactive Lab &rarr;</a>
    </div>
  </div>

  <script>
    const expData = {
      'wire-resistivity': {
        title: '1. Wire Resistivity (V vs I Graph)',
        category: 'Current Electricity',
        desc: 'Measure electric current and potential difference to verify Ohm’s law and calculate resistance per unit length.',
        file: 'experiments/wire-resistivity.html',
        objectives: ['Plot V vs I characteristic curve', 'Determine resistance from graph slope', 'Calculate specific wire resistivity'],
        formulas: ['V = I × R (Ohm’s Law)', 'Resistivity ρ = (R × A) / L']
      },
      'meter-bridge': {
        title: '2. Resistance using Metre Bridge',
        category: 'Current Electricity',
        desc: 'Find the unknown resistance of a resistor or metallic wire using Wheatstone bridge principles.',
        file: 'experiments/meter-bridge.html',
        objectives: ['Locate null point on 100 cm wire', 'Calculate unknown resistance R'],
        formulas: ['X = R × (100 - l) / l']
      },
      'metre-bridge-combination': {
        title: '3. Series & Parallel Combination',
        category: 'Current Electricity',
        desc: 'Verify the theoretical laws of equivalent resistance for series and parallel configurations using a metre bridge.',
        file: 'experiments/metre-bridge-combination.html',
        objectives: ['Verify Series Law: Rs = R1 + R2', 'Verify Parallel Law: 1/Rp = 1/R1 + 1/R2'],
        formulas: ['Series: Rs = R1 + R2', 'Parallel: Rp = (R1 × R2) / (R1 + R2)']
      },
      'concave-mirror': {
        title: '4. Concave Mirror Focal Length',
        category: 'Ray Optics',
        desc: 'Simulate object distance (u) and image distance (v) tracking to determine concave mirror focal length.',
        file: 'experiments/concave-mirror.html',
        objectives: ['Track real image formation', 'Calculate focal length f'],
        formulas: ['Mirror Formula: 1/f = 1/v + 1/u']
      },
      'convex-lens': {
        title: '5. Convex Lens Focal Length',
        category: 'Ray Optics',
        desc: 'Determine focal length of a convex optical lens by plotting u vs v and 1/u vs 1/v graph lines.',
        file: 'experiments/convex-lens.html',
        objectives: ['Plot u-v curves', 'Extract focal length from intercepts'],
        formulas: ['Lens Formula: 1/f = 1/v - 1/u']
      },
      'p-n-junction-diode': {
        title: '6. P-N Junction Diode',
        category: 'Electronics',
        desc: 'Explore semiconductor diode behaviour under forward and reverse bias conditions.',
        file: 'experiments/p-n-junction-diode.html',
        objectives: ['Identify knee voltage', 'Observe reverse breakdown curve'],
        formulas: ['Diode Current: I = I0 × (e^(qV/nkT) - 1)']
      },
      'pn-diode': {
        title: '6. P-N Junction Diode',
        category: 'Electronics',
        desc: 'Explore semiconductor diode behaviour under forward and reverse bias conditions.',
        file: 'experiments/p-n-junction-diode.html',
        objectives: ['Identify knee voltage', 'Observe reverse breakdown curve'],
        formulas: ['Diode Current: I = I0 × (e^(qV/nkT) - 1)']
      },
      'pn-junction-diode': {
        title: '6. P-N Junction Diode',
        category: 'Electronics',
        desc: 'Explore semiconductor diode behaviour under forward and reverse bias conditions.',
        file: 'experiments/p-n-junction-diode.html',
        objectives: ['Identify knee voltage', 'Observe reverse breakdown curve'],
        formulas: ['Diode Current: I = I0 × (e^(qV/nkT) - 1)']
      },
      'screw-gauge': {
        title: '7. Screw Gauge Tool',
        category: 'Additional Tools',
        desc: 'Interactive 3D micrometer screw gauge to practice least count, pitch, and zero error correction.',
        file: 'experiments/screw-gauge.html',
        objectives: ['Measure wire diameter', 'Determine Pitch and Least Count'],
        formulas: ['Least Count = Pitch / Total Circular Scale Divisions']
      }
    };

    const params = new URLSearchParams(window.location.search);
    const expId = params.get('id');
    const data = expData[expId] || expData['wire-resistivity'];

    document.getElementById('expTitle').innerText = data.title;
    document.getElementById('expCategory').innerText = data.category;
    document.getElementById('expDesc').innerText = data.desc;
    document.getElementById('graphicTitle').innerText = data.title + ' Simulation';
    document.getElementById('launchBtn').href = data.file;

    document.getElementById('expObjectives').innerHTML = data.objectives.map(o => `<li>${o}</li>`).join('');
    document.getElementById('expFormulas').innerHTML = data.formulas.map(f => `<li>${f}</li>`).join('');
  </script>
</body>
</html>
