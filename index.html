<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Visualizations</title>
  <style>
    /* Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #06090e;
      color: #e8edf2;
    }

    /* Top Navigation Bar Layout */
    .navbar {
      display: flex;
      align-items: center;
      background-color: #0a0e14;
      border-bottom: 1px solid #1f2833;
      padding: 0 24px;
      height: 60px;
    }

    .nav-container {
      display: flex;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }

    .nav-logo {
      color: #00d2ff;
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-item {
      color: #e8edf2;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .nav-item:hover {
      color: #ffd166;
    }

    /* Visualizations Dropdown Controls */
    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
    }

    .dropdown-btn .arrow {
      font-size: 10px;
      transition: transform 0.2s ease;
    }

    .dropdown:hover .arrow {
      transform: rotate(180deg);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #10151d;
      min-width: 310px;
      box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f2833;
      border-radius: 8px;
      padding: 12px 0;
      margin-top: 12px;
      z-index: 1000;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Chapter Segregation Styling */
    .dropdown-group {
      padding: 6px 16px;
    }

    .dropdown-group:not(:last-child) {
      border-bottom: 1px solid #1f2833;
      margin-bottom: 8px;
      padding-bottom: 12px;
    }

    .chapter-title {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #7f8ea3;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .dropdown-content a {
      color: #e8edf2;
      padding: 6px 0;
      text-decoration: none;
      display: block;
      font-size: 13.5px;
      transition: color 0.15s ease;
    }

    .dropdown-content a:hover {
      color: #ffd166;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">Physics Visualizations</a>
      
      <!-- Integrated Top-level Navigation Links -->
      <nav class="nav-links">
        <a href="/index.html" class="nav-item">Home</a>
        <a href="/experiments.html" class="nav-item">Experiments</a>
        <a href="/about.html" class="nav-item">About</a>
        
        <!-- Inline Dropdown Section for 3D Visualizations -->
        <div class="nav-item dropdown">
          <button class="dropdown-btn">
            Visualizations <span class="arrow">▾</span>
          </button>
          
          <div class="dropdown-content">
            
            <!-- Chapter: Electrostatics & Capacitance -->
            <div class="dropdown-group">
              <span class="chapter-title">Electrostatics & Capacitance</span>
              <a href="capacitor_charging_3d_2.html">Charging a Parallel Plate Capacitor (3D)</a>
            </div>

            <!-- Chapter: Moving Charges & Magnetism -->
            <div class="dropdown-group">
              <span class="chapter-title">Moving Charges & Magnetism</span>
              <a href="circular_loop_axis_field_2.html">Magnetic Field on Axis of Circular Loop (NCERT 4.9)</a>
            </div>

          </div>
        </div>
      </nav>
    </div>
  </header>

</body>
</html>
